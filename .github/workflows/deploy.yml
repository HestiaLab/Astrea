name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore Astrea.sln

      - name: Test (non-browser; browser coverage runs in CI)
        run: dotnet test Astrea.sln --no-restore -c Release --filter "TestCategory!=Browser"

      - name: Publish demo
        run: dotnet publish src/Astrea.Demo --no-restore -c Release -o publish

      - name: Rewrite base href and emit the SPA fallback
        run: |
          sed -i 's|<base href="/" />|<base href="/Astrea/" />|' publish/wwwroot/index.html
          grep -q '<base href="/Astrea/" />' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
